
name: Issue Self-Assignment

on:
  issue_comment:
    types: [created]

permissions:
  issues: write

jobs:
  assign:
    if: >-
      github.event.issue.pull_request == null &&
      github.event.comment.body == '/assign' &&
      github.event.comment.user.type == 'User'
    runs-on: ubuntu-latest
    steps:
      - name: Assign issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          USER: ${{ github.event.comment.user.login }}
        run: |
          set -e
          current=$(gh issue view "$ISSUE_NUMBER" --json assignees --jq '[.assignees[].login] | join(",")')
          if [ -n "$current" ]; then
            gh issue comment "$ISSUE_NUMBER" --body "This issue is already assigned to: $current."
            exit 0
          fi
          gh issue edit "$ISSUE_NUMBER" --add-assignee "$USER"
          gh issue comment "$ISSUE_NUMBER" --body "Assigned to @$USER. Happy contributing!"
